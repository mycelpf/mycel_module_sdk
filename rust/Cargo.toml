[package]
name = "mycel_module_sdk"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tonic-health = "0.12"
tokio = { version = "1", features = ["net", "rt", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
libc = "0.2"

[build-dependencies]
tonic-build = "0.12"
